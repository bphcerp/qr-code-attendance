services:
  dadu-attendance:
    build: .
    # PORT is interpolated from the .env sitting next to this file, the same way
    # the other bphcerp compose files do it. It must be set there (compose fails
    # on an empty ${PORT}); 4601 is the chosen one -- not 9090, which is dadu-web's
    # -- and it must match whatever the reverse proxy is pointed at.
    ports:
      - "${PORT}:${PORT}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=${PORT}
    # required: false is the whole trick. The prod command names the service
    # (`docker compose up -d dadu-attendance`) with the `dev` profile inactive, so
    # `db` is neither started nor required -- prod keeps talking to Supabase. Only
    # `docker compose --profile dev up` activates `db`, and then the app waits for
    # it to be healthy first. (If an older compose ignores required:false and pulls
    # db into prod, delete this depends_on and let the entrypoint's migrate retry
    # under restart: unless-stopped instead.)
    depends_on:
      db:
        condition: service_healthy
        required: false

  # Local Postgres for `docker compose --profile dev up`. Not started in prod --
  # the server points DATABASE_URL/DIRECT_URL at Supabase. This exists so the
  # stack runs locally without Supabase, and as the target the app will move to
  # when the local-db switch happens. Mirrors the postgres service in
  # bphcerp/Office-Task-Tracker.
  db:
    image: postgres:16-alpine
    profiles: ["dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
    # Host port 55432 matches the embedded-postgres dev port (scripts/localDb.ts
    # and the README), so host-side tools -- `npm run dev`, drizzle-kit studio --
    # reach it at localhost:55432. Inside the compose network the app uses db:5432.
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - attendance-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-attendance}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attendance-db-data:
